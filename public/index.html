<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디자이너 업무 플로어 - 로그인</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>디자이너 업무 플로어</h1>
      <p>@daplan.com 이메일로 로그인하세요</p>
      <form id="loginForm" class="login-form">
        <input type="email" id="emailInput" class="login-input" placeholder="name@daplan.com" required>
        <button type="submit" class="login-submit">로그인</button>
      </form>
      <div id="loginError" style="display:none;color:#e74c3c;font-size:13px;text-align:center;margin-top:12px;"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
